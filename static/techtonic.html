<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitleTechtonic">Techtonic Bar mode</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at 20% 20%, #1b2b45 0%, #0c1524 45%, #080d16 100%);
            color: #ffffff;
        }
        body {
            zoom: 1.25;
        }
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 1.3em 1em 7em;
            box-sizing: border-box;
            text-align: center;
        }
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(74, 136, 217, 0.25) 0%, rgba(219, 123, 83, 0.28) 100%);
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 24px;
            padding: 1em 1em 1.2em;
            margin-bottom: 1em;
            padding-top: 2.8em;
        }
        .itk-logo {
            position: absolute;
            top: 0.6em;
            left: 1em;
            width: 144px; /* 200% of previous 72px */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
            z-index: 35;
        }
        .language-switch {
            position: absolute;
            top: 0.5em;
            right: 0.55em;
            display: flex;
            gap: 0.25em;
            z-index: 40;
        }
        .language-btn {
            min-height: 30px;
            min-width: 44px;
            font-size: 0.9em;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 0.08em;
            padding: 0.3em 0.4em;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.18);
            box-shadow: none;
            color: #fff;
            cursor: pointer;
        }
        .language-btn.selected {
            border: 2px solid #ffffff;
            background: rgba(255,255,255,0.33);
        }
        h1 {
            margin: 0 0 0.2em;
            font-size: 2.1em;
        }
        .subtitle {
            margin: 0;
            opacity: 0.9;
            font-size: 1em;
        }
        .joke-grid {
            margin-top: 1em;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.8em;
        }
        .joke-btn {
            border: 0;
            border-radius: 16px;
            min-height: 308px;
            font-size: 2.8em;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
            padding: 1.1em 0.9em;
            line-height: 1.15;
        }
        .joke-btn.robot {
            background: linear-gradient(135deg, #3e8dd9 0%, #2a63a8 100%);
        }
        .joke-btn.bar {
            background: linear-gradient(135deg, #d7724f 0%, #b45231 100%);
        }
        .joke-btn.combo {
            background: linear-gradient(135deg, #2ea977 0%, #1f7a56 100%);
        }
        .hint {
            margin-top: 0.8em;
            opacity: 0.86;
            font-size: 0.95em;
        }
        #status {
            margin-top: 1em;
            background: rgba(255,255,255,0.12);
            border-radius: 12px;
            min-height: 6em;
            white-space: pre-wrap;
            text-align: left;
            padding: 0.9em;
        }
        .quick-nav {
            position: fixed;
            left: 1em;
            right: 1em;
            bottom: 0.8em;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.55em;
            z-index: 25;
        }
        .quick-nav button {
            min-height: 58px;
            font-size: 0.95em;
            padding: 0.55em 0.7em;
            border-radius: 12px;
            background: linear-gradient(135deg, #2d4a6b 0%, #18324f 100%);
            color: #fff;
            border: 0;
            cursor: pointer;
        }
        .footer-credit {
            position: fixed;
            bottom: 0.5em;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            opacity: 0.75;
            text-align: center;
            z-index: 10;
            white-space: nowrap;
        }
        @media (max-width: 760px) {
            .joke-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <img src="itk-logo.png" alt="ITK logo" class="itk-logo" id="itkLogoInTechtonic" />
            <div id="languageSwitch" class="language-switch" aria-label="Language selector">
                <button type="button" class="language-btn" data-lang="da" onclick="Commands.setLanguage('da')">DK</button>
                <button type="button" class="language-btn" data-lang="en" onclick="Commands.setLanguage('en')">EN</button>
                <button type="button" class="language-btn" data-lang="de" onclick="Commands.setLanguage('de')">DE</button>
            </div>
            <h1 id="techtonicTitle">Techtonic Bar mode</h1>
            <p id="techtonicSubtitle" class="subtitle">Tryk for at høre jokes fra Norma.</p>
        </div>

        <div class="joke-grid">
            <button id="btnTechtonicRobot" class="joke-btn robot" type="button" onclick="Commands.sayTechtonicRobotJoke()">Robot-joke</button>
            <button id="btnTechtonicBar" class="joke-btn bar" type="button" onclick="Commands.sayTechtonicBarJoke()">Bar-joke</button>
            <button id="btnTechtonicFusion" class="joke-btn combo" type="button" onclick="Commands.sayTechtonicFusionJoke()">Techtonic combo</button>
        </div>

        <p id="techtonicHint" class="hint">Tryk pa en joke-knap, sa leverer Norma en linje.</p>
        <div id="status"><span id="statusPlaceholder">Status vises her...</span></div>
    </div>

    <div class="quick-nav">
        <button id="btnHome" type="button" onclick="Commands.goHome()">Hovedmenu</button>
    </div>

    <div id="footerCredit" class="footer-credit">udviklet af ITK</div>

    <script src="app.js?v=20260817"></script>
</body>
</html>
